# yaml-language-server: $schema=../../config.schema.json
# Design used by the end-to-end test for test/fixtures/wrapped.yaml
input: ./wrapped.yaml
ui:
  title: Mon back-office
  locale: fr
  # French by default, English in the language switch
  locales: [fr, en]
  translations:
    en:
      Mon back-office: My back office
      Utilisateurs: Users
      Utilisateur: User
      Surnom: Nickname
      Rôle: Role
      Adresse e-mail: Email address
      Mot de passe: Password
      Changer le statut: Change status
      Réinitialiser le mot de passe: Reset password
      Comptes des personnes qui utilisent l'application.: Accounts of the people who use the app.
  primaryColor: "#16a34a"
  currency: EUR
  nav: [roles, users]
  resources:
    auth:
      fields:
        email: { label: Adresse e-mail, placeholder: vous@exemple.com }
        password: { label: Mot de passe }
    users:
      label: Utilisateurs
      singularLabel: Utilisateur
      description: Comptes des personnes qui utilisent l'application.
      icon: users
      columns: [name, nickname, roleId, active]
      filters: [roleId, active]
      fields:
        nickname: { label: Surnom, help: Affiché dans l'application }
        roleId: { label: Rôle }
        reason: { label: Motif, widget: textarea }
      actions:
        setUserStatus: { label: Changer le statut }
        resetUserPassword: { label: Réinitialiser le mot de passe }
    roles:
      icon: shield
    teams:
      hidden: true
